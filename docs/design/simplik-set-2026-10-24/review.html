<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новый набор Симплика</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f5fb;color:#282337;font:16px/1.5 system-ui}body.dark{background:#191623;color:#f5effc}main{max-width:1200px;margin:auto}h1{margin:0;font-size:28px}button,select{font:inherit;padding:8px 12px;border:1px solid #958aab;border-radius:10px}nav{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{padding:16px;border-radius:20px;background:#ece8f3;min-width:0}.dark .card{background:#272233}h2{font-size:17px;margin:0}.simplik{aspect-ratio:1;position:relative}.simplik svg{position:absolute;inset:0;width:100%;height:100%}.small{display:flex;align-items:center;gap:12px}.mini{width:40px;height:40px}.medium{width:64px;height:64px}.orbits{max-width:360px}p{margin:8px 0}header p{max-width:900px}@media(max-width:750px){body{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
<main><header><h1>Симплик · новый набор</h1><p>Утверждённое худи, лабораторный халат, шапочка, скафандр, очки и наушники. Крупный вид и миниатюры 40/64 px.</p></header>
<nav><button id="theme" type="button">Сменить тему</button><label>Цвет <select id="color"><option value="purple">Фиолетовый</option><option value="blue">Голубой</option><option value="mint">Мятный</option><option value="pink">Розовый</option><option value="gold">Золотой</option></select></label><label>Лицо <select id="face"><option value="smile">Улыбка</option><option value="wink">Подмигивание</option><option value="wow">Удивление</option><option value="happy">Радость</option></select></label></nav>
<section class="grid" id="gallery"></section>
<h2 style="margin-top:24px">Большой предпросмотр с орбитами</h2><div class="orbits" id="orbit"></div>
<p>Скафандр скрывает одежду и наушники. Их выбор сохраняется и возвращается после снятия шлема. Очки помещаются внутри проёма.</p>
</main><script src="/frontend/js/avatar.js"></script><script>
const examples=[['Без вещей',{}],['Худи',{outfit:'hoodie'}],['Халат',{outfit:'labcoat'}],['Шапочка',{outfit:'hoodie',hat:'graduate'}],['Очки',{outfit:'hoodie',accessory:'glasses'}],['Защитные очки',{outfit:'labcoat',accessory:'goggles'}],['Наушники',{outfit:'hoodie',accessory:'headphones'}],['Скафандр',{hat:'space'}],['Шапочка и наушники',{outfit:'hoodie',hat:'graduate',accessory:'headphones'}],['Скафандр и очки',{hat:'space',accessory:'glasses'}],['Скафандр и защитные очки',{hat:'space',accessory:'goggles'}],['Скрытые худи и наушники',{hat:'space',outfit:'hoodie',accessory:'headphones'}]];
for(const [title,config] of examples){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=title;card.append(h);for(const className of ['large','small']){const wrap=document.createElement('div');wrap.className=className;for(const size of (className==='large'?['']:['mini','medium'])){const host=document.createElement('div');host.className=size;host.dataset.avatar=JSON.stringify(config);wrap.append(host)}card.append(wrap)}document.querySelector('#gallery').append(card)}
function draw(){const base={color:document.querySelector('#color').value,face:document.querySelector('#face').value,outfit:'none',accessory:'none',hat:'none'};document.querySelectorAll('[data-avatar]').forEach(host=>MosAvatar.render(host,{...base,...JSON.parse(host.dataset.avatar)}));MosAvatar.render(document.querySelector('#orbit'),{...base,outfit:'hoodie'},{orbits:true})}document.querySelector('#color').onchange=draw;document.querySelector('#face').onchange=draw;document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');draw();
</script></html>
