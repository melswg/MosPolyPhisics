<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — МосПолиФизикс</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../figma.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-modal-page">
    <a href="login.html" class="auth-modal-page__backdrop" aria-label="Закрыть и вернуться ко входу"></a>
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="reset-request-title">
        <a href="login.html" class="auth-modal__close" aria-label="Закрыть">&times;</a>
        <div class="auth-modal__inner">
            <div class="auth-modal__toolbar">
                <button type="button" class="theme-toggle" aria-label="Переключить тему"><i class="fa-regular fa-sun"></i></button>
            </div>
            <h1 id="reset-request-title">Восстановление пароля</h1>
            <form id="reset-request-form">
                <div class="form-field">
                    <label for="reset-email">Почта аккаунта</label>
                    <input id="reset-email" name="email" type="email" autocomplete="email" required>
                </div>
                <button type="submit" class="btn-primary">Отправить ссылку</button>
                <p id="reset-request-msg" class="form-msg" role="status"></p>
            </form>
            <p class="auth-modal__home"><a href="login.html">Вернуться ко входу</a></p>
        </div>
    </div>
    <script src="../site-config.js"></script>
    <script src="../api.js"></script>
    <script src="../scripts.js"></script>
    <script src="../password_reset_page.js"></script>
</body>
</html>
